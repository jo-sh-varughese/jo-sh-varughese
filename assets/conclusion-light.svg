<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img"><title>§6 Conclusion.</title><defs><style>@font-face{font-family:'Xr';src:url(data:font/woff2;base64,) format('woff2');}
.r{font-family:'Xr','STIX Two Text',Georgia,serif;font-feature-settings:'kern','liga','lnum','pnum';}
@font-face{font-family:'Xb';src:url(data:font/woff2;base64,) format('woff2');}
.b{font-family:'Xb','STIX Two Text',Georgia,serif;font-feature-settings:'kern','liga','lnum','pnum';}
@font-face{font-family:'Xbi';src:url(data:font/woff2;base64,) format('woff2');}
.bi{font-family:'Xbi','STIX Two Text',Georgia,serif;font-feature-settings:'kern','liga','lnum','pnum';}
</style></defs><text x="4.0" y="40.0" class="r" font-size="27" fill="#7A3D12" text-anchor="start">6</text>
<text x="35.4" y="40.0" class="b" font-size="27" fill="#23224A" text-anchor="start">Conclusion</text>
<text x="6.0" y="96.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">This profile set out to describe one researcher and found a consistent pattern. The work goes where machine</tspan></text>
<text x="6.0" y="126.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">learning has to be trusted: in what a federated model reveals, whether a training run is honest, how an LLM</tspan></text>
<text x="6.0" y="156.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">judges, and what an explanation still means after the model is steered. Every paper ends by reporting where its</tspan></text>
<text x="6.0" y="186.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">own method breaks.</tspan></text>
<text x="6.0" y="230.0" font-size="19" xml:space="preserve"><tspan class="bi" fill="#23224A">Future work. </tspan><tspan class="r" fill="#23224A">The author is open to research collaborations on privacy-preserving ML, robust and federated</tspan></text>
<text x="6.0" y="260.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">learning, training integrity, LLM evaluation, interpretability and clinical AI, and is applying to graduate</tspan></text>
<text x="6.0" y="290.0" font-size="19" xml:space="preserve"><tspan class="r" fill="#23224A">research positions starting Fall 2027. Correspondence details are in §7.</tspan></text>
</svg>